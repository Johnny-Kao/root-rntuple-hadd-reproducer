name: Research output checksum metadata
on:
  push:
    branches:
      - research/page-metadata-20261110
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install released ROOT binary
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: ROOT
          python -c 'import ROOT; print("ROOT_VERSION", ROOT.gROOT.GetVersion())'
      - name: Compile and run metadata test
        shell: bash
        run: |
          set -euo pipefail
          ROOT_HOME="$(python -c 'import ROOT; from pathlib import Path; print(Path(ROOT.__file__).resolve().parent)')"
          ROOT_LIBDIR="$ROOT_HOME/lib"
          ROOT_VENDOR_LIBDIR="$ROOT_HOME/../root.libs"
          export PATH="$ROOT_HOME/bin:$PATH"
          export LD_LIBRARY_PATH="$ROOT_LIBDIR:$ROOT_VENDOR_LIBDIR"
          g++ -std=c++17 -O1 -g -I"$ROOT_HOME/include" validation/metadata_fastmerge.cxx -o metadata_fastmerge -L"$ROOT_LIBDIR" -Wl,-rpath-link,"$ROOT_VENDOR_LIBDIR" $(root-config --cflags --libs) -lROOTNTuple
          mkdir -p /tmp/metadata-fastmerge
          cd /tmp/metadata-fastmerge
          "$GITHUB_WORKSPACE/metadata_fastmerge"
